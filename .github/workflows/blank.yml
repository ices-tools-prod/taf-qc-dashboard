name: Create Master Json for Front End Consumption

on:
#  schedule:
#  - cron: "7 * * * *"

  workflow_dispatch:

jobs:
  generate-master-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard repository
        uses: ices-tools-prod/ices-tools-prod-actions-checkout@main

      - name: Generate master.json
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/masterJsonScript

          ./scripts/masterJsonScript

      - name: Verify master.json
        shell: bash
        run: |
          set -euo pipefail

          jq empty master.json

          echo "Repository count:"
          jq length master.json

      - name: Commit master.json
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.json

          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update master.json"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: git push
