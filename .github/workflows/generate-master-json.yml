name: Create Master Json for Front End Consumption

on:
#  schedule:
#  - cron: "7 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qc-metadata
  cancel-in-progress: false

jobs:
  generate-master-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard repository
        uses: ices-tools-prod/ices-tools-prod-actions-checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

      - name: Generate master.json
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/masterJsonScript

          ./scripts/masterJsonScript

      - name: Verify master.json
        shell: bash
        run: |
          set -euo pipefail

          jq empty master.json

          echo "Repository count:"
          jq length master.json

      - name: Commit and push master.json
        id: commit
        uses: ./.github/actions/commit-generated-file
        with:
          file: master.json
          message: Update master.json
