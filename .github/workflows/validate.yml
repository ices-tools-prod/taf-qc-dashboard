name: Collect QC Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  taf-qc-validation-pipeline:
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.build-matrix.outputs.repos) }}
    runs-on: ubuntu-latest
    steps:
      - uses: ices-tools-prod/ices-tools-prod-actions-checkout@main



      - name: Debug output
        run: |
          echo "${{ matrix.repo }}"
          echo ls -la

      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          gh repo clone "${{ matrix.repo }}" repo-work
            
      - name: Access cloned repository content
        run: |
          cd repo-work
          ls -la
      - name: Calculate hash
        id: hash
        working-directory: repo-work
        run: |
          if [ -n "$(find boot -type f 2>/dev/null | head -1)" ]; then
          ROOT="boot"
          elif [ -n "$(find bootstrap -type f 2>/dev/null | head -1)" ]; then
          ROOT="bootstrap"
          else
          ROOT="."
          fi  

          echo "Using root: $ROOT"
          QC_HASH=$(
          {
          find "$ROOT" -maxdepth 1 -type f -name "DATA.bib" -print0
          find "$ROOT" -maxdepth 1 -type f -name "*.R" -print0

          [ -d "$ROOT/initial/data" ] &&
            find "$ROOT/initial/data" -type f -print0
          } |
          sort -z |
          xargs -0 sha256sum |
          sha256sum |
          cut -d' ' -f1
          )

          echo "hash=$QC_HASH" >> $GITHUB_OUTPUT

      - name: Read previous hash
        id: oldhash
        run: |
          REPO_NAME=$(basename "${{ matrix.repo }}")

          LATEST="metadata/$REPO_NAME/latest.json"

          if [ -f "$LATEST" ]; then
          echo "hash=$(jq -r '.qc_hash' "$LATEST")" >> $GITHUB_OUTPUT
          else
          echo "hash=" >> $GITHUB_OUTPUT
          fi
      
      - name: Compare hashes
        id: compare
        run: |
          if [ "${{ steps.hash.outputs.hash }}" = "${{ steps.oldhash.outputs.hash }}" ] &&
          [ -n "${{ steps.oldhash.outputs.hash }}" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          else
          echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug hashes
        run: |
          echo "New hash: [${{ steps.hash.outputs.hash }}]"
          echo "Old hash: [${{ steps.oldhash.outputs.hash }}]"
          echo "Hash changed?: [${{ steps.compare.outputs.changed }}]"

      - name: Get repo SHA
        id: sha
        working-directory: repo-work
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: No changes detected
        if: steps.compare.outputs.changed == 'false'
        run: |
          echo "## QC Check" >> $GITHUB_STEP_SUMMARY
          echo "QC hash unchanged, validation skipped." >> $GITHUB_STEP_SUMMARY
    
      - name: Run validator
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true 
        run: |
          docker run --rm \
          -v ${{ github.workspace }}/repo-work:/repo \
          -e GITHUB_SHA="${{ steps.sha.outputs.sha }}" \
          -e QC_HASH="${{ steps.hash.outputs.hash }}" \
          -e GITHUB_RUN_ID="${{ github.run_id }}" \
          -e GITHUB_REPOSITORY="${{ matrix.repo }}" \
          ghcr.io/ices-tools-prod/taf-qc-validator:latest \
          /repo



      - name: Prepare artifact
        if: always()
        run: |
          REPO_NAME=$(basename "${{ matrix.repo }}")
          mkdir -p artifact/$REPO_NAME
          JSON_FILE=$(find repo-work -name "*.json" | head -1)
          if [ -n "$JSON_FILE" ]; then
          cp "$JSON_FILE" artifact/$REPO_NAME/latest.json
          fi
      - name: Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.repo }}
          path: artifact
