name: Collect QC Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: ices-tools-prod/ices-tools-prod-actions-checkout@main

      - name: Show repos
        run: |
          jq -r '.[].nameWithOwner' repos.json

      - name: Get first repo
        id: repo
        run: |
          echo "repo=$(jq -r '.[0].nameWithOwner' repos.json)" >> $GITHUB_OUTPUT


      - name: Debug output
        run: |
          echo "${{ steps.repo.outputs.repo }}"
          echo ls -la

      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          mkdir repo-work
          gh repo clone "${{ steps.repo.outputs.repo }}" repo-work
            
      - name: Access cloned repository content
        run: |
          cd repo-work
          ls -la
      - name: Calculate hash
        id: hash
        working-directory: repo-work
        run: |
          QC_HASH=$(
          {
          find boot -maxdepth 1 -type f -name "DATA.bib" -print0
          find boot -maxdepth 1 -type f -name "*.R" -print0
          find boot/initial/data -type f -print0
          } |
          sort -z |
          xargs -0 sha256sum |
          sha256sum |
          cut -d' ' -f1
          )

          echo "hash=$QC_HASH" >> $GITHUB_OUTPUT

      - name: Read previous hash
        id: oldhash
        run: |
          REPO_NAME=$(basename "${{ steps.repo.outputs.repo }}")

          LATEST="metadata/$REPO_NAME/latest.json"

          if [ -f "$LATEST" ]; then
          echo "hash=$(jq -r '.qc_hash' "$LATEST")" >> $GITHUB_OUTPUT
          else
          echo "hash=" >> $GITHUB_OUTPUT
          fi
      
      - name: Compare hashes
        id: compare
        run: |
          if [ "${{ steps.hash.outputs.hash }}" = "${{ steps.oldhash.outputs.hash }}" ] &&
          [ -n "${{ steps.oldhash.outputs.hash }}" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          else
          echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug hashes
        run: |
          echo "New hash: [${{ steps.hash.outputs.hash }}]"
          echo "Old hash: [${{ steps.oldhash.outputs.hash }}]"
          echo "Hash changed?: [${{ steps.compare.outputs.changed }}]"

      - name: Run validator
        if: steps.compare.outputs.changed == 'true'
        run: |
          docker run --rm \
          -v ${{ github.workspace }}/repo-work:/repo \
          -e QC_HASH="${{ steps.hash.outputs.hash }}" \
          -e GITHUB_REPOSITORY="${{ steps.repo.outputs.repo }}" \
          ghcr.io/ices-tools-prod/taf-qc-validator:latest \
          /repo
      - name: Store metadata
        if: steps.compare.outputs.changed == 'true'
        run: |
          JSON_FILE=$(find repo-work -name "*.json" | head -1)

          TIMESTAMP=$(jq -r '.timestamp' "$JSON_FILE" \
          | sed 's/:/-/g')

          REPO="${{ steps.repo.outputs.repo }}"

          REPO_NAME=$(basename "$REPO")
          
          mkdir -p "metadata/$REPO_NAME"
          
          cp "$JSON_FILE" \
          "metadata/$REPO_NAME/${TIMESTAMP}.json"
          
          cp "$JSON_FILE" \
          "metadata/$REPO_NAME/latest.json"


      - name: Commit metadata
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add metadata

          git commit -m "Update metadata" || exit 0

          git push
