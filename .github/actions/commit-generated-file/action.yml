name: Commit generated file
description: Commit a generated file and push it to the workflow branch

inputs:
  file:
    description: Repository-relative generated file to commit
    required: true
  message:
    description: Commit message
    required: true

outputs:
  changed:
    description: Whether a commit was created
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - id: commit
      shell: bash
      env:
        GENERATED_FILE: ${{ inputs.file }}
        COMMIT_MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$GENERATED_FILE"

        if git diff --cached --quiet; then
          echo "No changes in $GENERATED_FILE"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git commit -m "$COMMIT_MESSAGE"
        git pull --rebase origin "$GITHUB_REF_NAME"
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
